<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="AlgoFlow">
  <!-- Six connected nodes radiating from a center hub (network/graph burst) -->
  <g stroke="#f5811f" stroke-width="6.5" stroke-linecap="round">
    <line x1="50" y1="50" x2="50"   y2="18"/>
    <line x1="50" y1="50" x2="77.7" y2="34"/>
    <line x1="50" y1="50" x2="22.3" y2="34"/>
    <line x1="50" y1="50" x2="77.7" y2="66"/>
    <line x1="50" y1="50" x2="22.3" y2="66"/>
    <line x1="50" y1="50" x2="50"   y2="82"/>
  </g>
  <g fill="#f5811f">
    <circle cx="50"   cy="18" r="9.5"/>
    <circle cx="77.7" cy="34" r="9.5"/>
    <circle cx="22.3" cy="34" r="9.5"/>
    <circle cx="77.7" cy="66" r="9.5"/>
    <circle cx="22.3" cy="66" r="9.5"/>
    <circle cx="50"   cy="82" r="9.5"/>
    <circle cx="50"   cy="50" r="5.5"/>
  </g>
</svg>
