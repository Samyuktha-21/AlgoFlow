<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#080c16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5811f"/>
      <stop offset="1" stop-color="#ff9433"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.6">
      <stop offset="0" stop-color="#f5811f" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f5811f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- decorative algorithm bars — kept right of x=900 so the headline and
       subtitle never run underneath them -->
  <g opacity="0.9">
    <rect x="905"  y="360" width="44" height="150" rx="8" fill="#334155"/>
    <rect x="959"  y="300" width="44" height="210" rx="8" fill="#475569"/>
    <rect x="1013" y="230" width="44" height="280" rx="8" fill="url(#accent)"/>
    <rect x="1067" y="330" width="44" height="180" rx="8" fill="#475569"/>
    <rect x="1121" y="270" width="44" height="240" rx="8" fill="#334155"/>
  </g>

  <!-- node/edge motif -->
  <g stroke="#f5811f" stroke-width="3" opacity="0.55" fill="#0b0f1a">
    <line x1="120" y1="470" x2="230" y2="520" stroke-opacity="0.5"/>
    <line x1="230" y1="520" x2="300" y2="440" stroke-opacity="0.5"/>
    <circle cx="120" cy="470" r="12" fill="#f5811f"/>
    <circle cx="230" cy="520" r="12" fill="#f5811f"/>
    <circle cx="300" cy="440" r="12" fill="#f5811f"/>
  </g>

  <text x="96" y="150" font-size="34" font-weight="700" letter-spacing="6" fill="#f5811f">ALGOFLOW</text>

  <text x="92" y="265" font-size="70" font-weight="800" fill="#f8fafc">Learn algorithms</text>
  <text x="92" y="350" font-size="70" font-weight="800" fill="#f8fafc">by <tspan fill="url(#accent)">watching them run</tspan></text>

  <text x="96" y="424" font-size="28" font-weight="500" fill="#94a3b8">Step-by-step visualizations with code in 5 languages.</text>

  <g font-size="24" font-weight="700" fill="#cbd5e1">
    <text x="96" y="545">124 Algorithms</text>
    <text x="305" y="545" fill="#475569">•</text>
    <text x="335" y="545">108 Interview Questions</text>
    <text x="663" y="545" fill="#475569">•</text>
    <text x="693" y="545">Java · C · C++ · Python · JS</text>
  </g>

  <rect x="96" y="575" width="1008" height="4" rx="2" fill="url(#accent)" opacity="0.7"/>
</svg>
