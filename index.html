<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apply saved/OS theme before first paint to avoid a dark flash (FOUC) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('algoflow-theme');
          if (t !== 'light' && t !== 'dark') {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          }
          var d = document.documentElement;
          d.classList.add(t);
          d.classList.remove(t === 'light' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlgoFlow — Algorithm Visualizer</title>
    <meta name="description" content="Learn algorithms by watching them run — interactive, step-by-step visualizations with code in Java, C, C++, Python and JavaScript." />
    <link rel="canonical" href="https://algoflow-theta.vercel.app/" />

    <!-- Open Graph / social (per-page tags are injected at runtime by src/components/Seo.jsx) -->

    <meta property="og:url" content="https://algoflow-theta.vercel.app/" />
    <meta property="og:image" content="https://algoflow-theta.vercel.app/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AlgoFlow — Algorithm Visualizer" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
